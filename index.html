<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vademecum Tipologia B e C — Prima Prova</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --parchment:#f4ecd8;
  --parchment-dark:#ece0c4;
  --ink:#3a2f22;
  --ink-soft:#5c4d3a;
  --gold:#b8912f;
  --gold-dark:#8f6f22;
  --card:#fffdf6;
  --border:#d9c691;
  --green:#4d7a3a;
  --red:#a4442b;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--parchment);
  background-image: radial-gradient(circle at 20% 10%, rgba(184,145,47,0.08), transparent 40%),
                     radial-gradient(circle at 80% 90%, rgba(184,145,47,0.08), transparent 40%);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  line-height:1.6;
  padding-bottom:60px;
}
header{
  text-align:center;
  padding:40px 20px 24px;
  border-bottom:3px double var(--gold);
  background:var(--parchment-dark);
}
header h1{
  font-family:'Cormorant Garamond',serif;
  font-size:2.6em;
  margin:0 0 6px;
  color:var(--gold-dark);
  font-weight:700;
}
header p{
  margin:0;
  color:var(--ink-soft);
  font-size:1.05em;
}
.badge{
  display:inline-block;
  margin-top:10px;
  padding:4px 14px;
  border:1px solid var(--gold);
  border-radius:20px;
  font-size:0.85em;
  color:var(--gold-dark);
  background:#fffaf0;
}
nav{
  max-width:1000px;
  margin:24px auto 0;
  padding:0 16px;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
}
nav button{
  font-family:'Inter',sans-serif;
  font-weight:600;
  font-size:0.95em;
  padding:10px 18px;
  border:1px solid var(--gold);
  background:var(--card);
  color:var(--ink);
  border-radius:8px 8px 0 0;
  cursor:pointer;
  transition:all .15s;
}
nav button:hover{background:#fbf3de;}
nav button.active{
  background:var(--gold);
  color:#fff;
  border-color:var(--gold-dark);
}
main{
  max-width:1000px;
  margin:0 auto;
  padding:20px 16px 40px;
}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:22px 24px;
  margin-bottom:22px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}
.card h2{
  font-family:'Cormorant Garamond',serif;
  color:var(--gold-dark);
  font-size:1.6em;
  margin-top:0;
  border-bottom:1px solid var(--border);
  padding-bottom:8px;
}
.step{
  display:flex;
  gap:14px;
  margin-bottom:16px;
  align-items:flex-start;
}
.step-num{
  flex:0 0 auto;
  width:34px;height:34px;
  border-radius:50%;
  background:var(--gold);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-weight:700;
  font-family:'Cormorant Garamond',serif;
  font-size:1.1em;
}
.step-body h4{margin:0 0 4px;font-size:1.05em;}
.step-body p{margin:0;color:var(--ink-soft);font-size:0.95em;}
.connettivi{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.connettivi span{
  background:#fbf3de;border:1px solid var(--border);
  padding:4px 10px;border-radius:6px;font-size:0.85em;color:var(--ink-soft);
}
.year-block{margin-bottom:30px;}
.year-title{
  font-family:'Cormorant Garamond',serif;
  font-size:2em;color:var(--gold-dark);
  border-bottom:2px solid var(--gold);
  padding-bottom:6px;margin-bottom:6px;
}
.year-sub{color:var(--ink-soft);font-size:0.9em;margin-bottom:18px;}
.tema-card{
  border:1px solid var(--border);border-radius:10px;
  background:var(--card);margin-bottom:18px;overflow:hidden;
}
.tema-head{
  padding:16px 20px;cursor:pointer;
  display:flex;justify-content:space-between;align-items:center;
  background:var(--parchment-dark);
}
.tema-head:hover{background:#e6d9ae;}
.tema-head .tipo-badge{
  font-size:0.75em;font-weight:700;padding:3px 10px;border-radius:12px;
  color:#fff;margin-right:10px;white-space:nowrap;
}
.badge-B{background:#8f6f22;}
.badge-C{background:#6b7f3f;}
.tema-head-text{flex:1;}
.tema-head-text .fonte{
  display:block;font-size:0.85em;color:var(--ink-soft);font-weight:400;margin-top:2px;
}
.chevron{font-size:1.2em;color:var(--gold-dark);transition:transform .2s;}
.tema-body{max-height:0;overflow:hidden;transition:max-height .35s ease;padding:0 22px;}
.tema-body.open{max-height:8000px;padding:6px 22px 22px;}
.tema-body h4{
  font-family:'Cormorant Garamond',serif;font-size:1.2em;color:var(--gold-dark);margin:16px 0 8px;
}
.tema-body p{margin:0 0 12px;}
.svolgimento{
  background:#fbf7ea;border-left:3px solid var(--gold);
  padding:14px 18px;font-size:0.97em;border-radius:0 6px 6px 0;
}
.commento ul, .domande ol{margin:0;padding-left:20px;}
.commento li, .domande li{margin-bottom:6px;color:var(--ink-soft);}
.domande{background:#f6f0e0;border-radius:6px;padding:12px 16px;}
.note-box{
  background:#f1f7ea;border:1px solid #b9cf9a;border-radius:8px;
  padding:14px 18px;font-size:0.92em;margin-bottom:24px;color:#3d4a2c;
}
.note-box a{color:#3d4a2c;font-weight:600;}
.checklist{list-style:none;padding:0;margin:0;}
.checklist li{
  padding:10px 14px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;
  background:#fffaf0;display:flex;gap:10px;align-items:flex-start;
}
.checklist input{margin-top:4px;}
table.grid{width:100%;border-collapse:collapse;margin-top:10px;font-size:0.92em;}
table.grid th,table.grid td{border:1px solid var(--border);padding:8px 10px;text-align:left;}
table.grid th{background:var(--parchment-dark);}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;}
@media(max-width:640px){.compare{grid-template-columns:1fr;}}
.compare .bad, .compare .good{border-radius:8px;padding:12px 14px;font-size:0.92em;}
.compare .bad{background:#fbeae5;border:1px solid #e0b6a6;}
.compare .good{background:#eaf3e2;border:1px solid #b9cf9a;}
.compare .lab{font-weight:700;display:block;margin-bottom:4px;}
.compare .bad .lab{color:var(--red);}
.compare .good .lab{color:var(--green);}
.quiz-box{margin-top:18px;background:#fdfaf1;border:1px dashed var(--gold);border-radius:8px;padding:16px 18px;}
.quiz-box h4{margin-top:0;}
.quiz-q{margin-bottom:14px;}
.quiz-q p.qtext{font-weight:600;margin:0 0 6px;}
.quiz-q label{
  display:block;padding:6px 10px;border:1px solid var(--border);border-radius:6px;
  margin-bottom:5px;background:#fff;cursor:pointer;font-size:0.93em;
}
.quiz-q label:hover{background:#fbf3de;}
.quiz-q label.correct{background:#e2f0d6;border-color:var(--green);}
.quiz-q label.wrong{background:#f6dcd4;border-color:var(--red);}
.quiz-btn{
  background:var(--gold);color:#fff;border:none;padding:9px 18px;border-radius:6px;
  font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
}
.quiz-btn:hover{background:var(--gold-dark);}
.quiz-result{margin-top:10px;font-weight:600;}
.source-tag{
  display:inline-block;font-size:0.75em;background:#e7dcc0;color:var(--ink-soft);
  padding:2px 8px;border-radius:10px;margin-left:6px;
}
footer{text-align:center;color:var(--ink-soft);font-size:0.8em;margin-top:30px;}
</style>
</head>
<body>

<header>
  <h1>Vademecum passo dopo passo</h1>
  <p>Tipologia B e Tipologia C della Prima Prova — Esame di Stato</p>
  <span class="badge">Percorso guidato per il Liceo Linguistico — 5ª classe</span>
</header>

<nav id="nav"></nav>
<main id="main"></main>

<footer>Materiale didattico ad uso interno — Istituto Omnicomprensivo Europeo di Arconate e Buscate</footer>

<script>

  {

    fonte:"Federico Chabod, «L'idea di Nazione» — traccia ufficiale Tipologia B, Esame di Stato 2023 (fonte: Ministero dell'Istruzione e del Merito, archivio Esame di Stato, istruzione.it)",
    guida:"Lo storico Federico Chabod mette a confronto due concezioni di nazione: quella naturalistica (lingua, territorio, stirpe comune) e quella volontaristica, secondo cui la nazione è una scelta consapevole e quotidiana di appartenenza.",
    domande:[

      "In che senso la nazione, nella visione volontaristica, sarebbe un «plebiscito di tutti i giorni»?",

      "Con quali argomenti si potrebbe sostenere una posizione intermedia tra le due concezioni?"
    ],
    metodo:"Quando il testo-guida propone una dicotomia storica (qui naturalistica/volontaristica), usala come struttura portante: presenta entrambe le posizioni, poi prendi le distanze in modo motivato.",
    testo:`Che cosa rende un insieme di persone una «nazione»? Federico Chabod distingue due risposte storiche a questa domanda: da un lato la concezione naturalistica, di matrice tedesca, secondo cui la nazione nasce da elementi oggettivi come la lingua, il territorio, la stirpe comune; dall'altro la concezione volontaristica, di origine francese, per cui la nazione è invece una scelta quotidiana, un «plebiscito di tutti i giorni», per usare la celebre espressione di Ernest Renan.

Credo che questa seconda visione sia oggi la più utile per comprendere le società contemporanee, sempre più plurali dal punto di vista linguistico, religioso ed etnico. Se la nazione fosse definita solo da fattori naturali immutabili, molte persone che vivono, lavorano e si sentono parte di un Paese senza condividerne le origini etniche ne resterebbero automaticamente escluse.

Si potrebbe obiettare che una nazione fondata solo sulla volontà rischi di essere troppo debole, priva di radici capaci di tenere unita la comunità nei momenti difficili. È un'osservazione legittima: la sola adesione volontaria, senza memoria condivisa né simboli comuni, può risultare fragile.

Per questo penso che la soluzione più equilibrata unisca le due prospettive: una memoria storica e culturale condivisa, ma aperta a chi sceglie di farne parte, non riservata a chi vi nasce per caso. È questa, mi sembra, l'idea di nazione più adatta a una cittadinanza consapevole nel mondo di oggi.`,
    commento:[
      "Impostare il B come confronto tra due concezioni storiche prima di scegliere è un buon modello quando il testo-guida presenta una dicotomia.",
      "Citare l'espressione «plebiscito di tutti i giorni» di Renan dà spessore culturale senza bisogno di citazioni lunghe dal testo-guida.",
      "La sintesi finale, che unisce le due prospettive invece di sceglierne una sola, mostra capacità di mediazione critica."
    ],
    quiz:[
      {q:"Qual è la distinzione centrale introdotta nel testo di Chabod?", opts:["Nazione democratica e nazione autoritaria","Concezione naturalistica e concezione volontaristica di nazione","Nazione antica e nazione moderna","Nazione piccola e nazione grande"], correct:1},

      {q:"Perché lo svolgimento preferisce la concezione volontaristica per le società di oggi?", opts:["Perché è più antica","Perché è più inclusiva verso chi non condivide le origini etniche","Perché richiede meno storia comune","Perché è l'unica riconosciuta dal diritto internazionale"], correct:1},
      {q:"Quale rischio viene riconosciuto come antitesi nello svolgimento?", opts:["Che la nazione naturalistica sia impossibile da definire","Che una nazione solo volontaria rischi di essere fragile, priva di radici comuni","Che Renan avesse torto su tutto","Che le nazioni moderne non esistano più"], correct:1},
      {q:"Come si conclude lo svolgimento?", opts:["Scegliendo solo la concezione naturalistica","Proponendo di unire memoria condivisa e apertura volontaria","Rifiutando ogni idea di nazione","Ripetendo la domanda iniziale senza risposta"], correct:1}
    ]
  },
  {
    numero:"B2", tipo:"B", titolo:"Creatività e distruzione creativa: prepararsi al lavoro che cambia",
    fonte:"Piero Angela, «Dieci cose che ho imparato» — traccia ufficiale Tipologia B, Esame di Stato 2023 (fonte: Ministero dell'Istruzione e del Merito, istruzione.it)",
    guida:"Il testo-guida sosteneva che nel mondo attuale la creatività umana vale più delle materie prime, ma comporta anche fenomeni di «distruzione creativa» dei vecchi mestieri.",
    domande:[
      "Perché, secondo Piero Angela, la creatività è oggi la risorsa più importante?",
      "Che cos'è la «distruzione creativa» e quali esempi storici la illustrano?",
      "Quali categorie di lavoratori rischiano di essere sostituite dall'automazione, secondo il testo?",
      "In che modo la scuola, secondo l'autore, dovrebbe prepararsi a questo cambiamento?"
    ],
    metodo:"Quando il testo-guida introduce un concetto tecnico (qui: la «distruzione creativa» di Schumpeter), è un'occasione preziosa: definiscilo con parole tue in una riga, poi usalo come perno dell'argomentazione.",
    testo:`Piero Angela, nel suo libro-testamento Dieci cose che ho imparato, indica nella creatività la vera risorsa del futuro: non le materie prime, non la manodopera a basso costo, ma la capacità di inventare, progettare, innovare. È un'idea che trovo convincente, soprattutto in un'epoca in cui l'automazione e l'intelligenza artificiale sostituiscono sempre più mansioni ripetitive.

Il concetto di "distruzione creativa", elaborato dall'economista Joseph Schumpeter, descrive bene questo processo: ogni innovazione importante distrugge posti di lavoro legati a tecnologie superate, ma ne crea altri, spesso più qualificati, legati alla tecnologia nuova. È accaduto con l'industrializzazione, con l'informatica, e sta accadendo oggi con l'intelligenza artificiale. Chi possiede solo competenze meccaniche rischia di essere sostituito; chi sa essere creativo, cioè risolvere problemi in modo originale, resta insostituibile.

Qualcuno potrebbe obiettare che questa visione sia troppo ottimistica: la transizione tra un lavoro perso e uno nuovo creato non è mai automatica né indolore, e comporta spesso disoccupazione, riqualificazione difficile, disuguaglianze crescenti tra chi ha gli strumenti culturali per adattarsi e chi no. È un'obiezione fondata, che non va sottovalutata.

Proprio per questo credo che il ruolo della scuola sia decisivo: non solo trasmettere nozioni, ma allenare il pensiero critico, la capacità di collegare ambiti diversi, la curiosità, che sono gli ingredienti della creatività di cui parla Angela. Investire nella formazione, fin dai primi anni di scuola, significa preparare le persone non a un singolo mestiere che potrebbe scomparire, ma alla capacità di reinventarsi più volte nel corso della vita: questa, oggi, è la vera ricchezza.`,
    commento:[

    quiz:[
      {q:"In un testo argomentativo di Tipologia B, quando il testo-guida introduce un concetto tecnico, la strategia migliore è:", opts:["Ignorarlo perché troppo specialistico","Copiarlo tra virgolette senza commentarlo","Definirlo con parole proprie e usarlo come perno dell'argomentazione","Sostituirlo subito con un sinonimo più semplice"], correct:2},
      {q:"Perché nello svolgimento si cita l'economista Schumpeter?", opts:["Per allungare il testo","Per dare autorevolezza e precisione al concetto introdotto","Perché lo chiedeva la traccia parola per parola","Per contraddire Piero Angela"], correct:1},
      {q:"Qual è la tesi principale sostenuta nello svolgimento?", opts:["La tecnologia distruggerà tutti i lavori","La creatività umana resta la risorsa insostituibile, ma va sostenuta con la formazione","Bisogna vietare l'intelligenza artificiale","La scuola non ha alcun ruolo nel futuro del lavoro"], correct:1},
      {q:"Quale antitesi viene riconosciuta e non respinta a priori?", opts:["Che la creatività non esiste","Che la transizione tra vecchi e nuovi lavori comporta disuguaglianze reali","Che Schumpeter aveva torto","Che la scuola sia inutile"], correct:1},
      {q:"Con quale idea si chiude lo svolgimento?", opts:["Con un riassunto identico all'introduzione","Con l'invito a temere il progresso tecnologico","Con il ruolo decisivo della scuola nel formare pensiero critico e capacità di adattamento","Con una domanda retorica senza risposta"], correct:2}

  {

    guida:"Il brano, tratto dalla raccolta di interviste di Oriana Fallaci a capi di Stato e protagonisti del potere del Novecento, invita a riflettere sul valore dell'intervista come strumento di verità storica.",
    domande:[
      "Perché le interviste di Oriana Fallaci sono considerate, secondo il testo, documenti storici?",
      "Che differenza c'è tra un'intervista di inchiesta e una semplice raccolta di dichiarazioni ufficiali?",
      "Quali rischi comporta uno stile di intervista molto diretto e conflittuale?",
      "In che modo il principio del giornalismo di Fallaci resta attuale oggi?"
    ],
    metodo:"Nei B di ambito giornalistico-letterario, distingui sempre il metodo dell'autore (qui: lo stile diretto di Fallaci) dal principio più generale che se ne può ricavare: il primo è discutibile, il secondo spesso resta valido.",
    testo:`Oriana Fallaci ha fatto dell'intervista uno strumento non di cronaca ma di storia: i suoi colloqui con capi di Stato e protagonisti del potere del Novecento restano documenti perché nascevano da domande scomode, poste senza reverenza verso l'interlocutore, per quanto potente.

Trovo che questo approccio definisca ancora oggi il confine tra un buon giornalismo e una semplice cronaca di facciata. Intervistare un potente non significa raccogliere le sue dichiarazioni preconfezionate, ma metterlo di fronte alle contraddizioni della sua azione politica, costringerlo a rispondere nel merito.

Qualcuno potrebbe obiettare che uno stile così diretto, quasi di scontro, rischi di trasformare l'intervista in un atto di ostilità personale più che in un'indagine, compromettendo l'obiettività giornalistica. È un rischio reale, che la stessa Fallaci non sempre riuscì a evitare del tutto.

Per questo credo che il vero insegnamento della sua opera non sia lo stile aggressivo in sé, ma il principio che lo sostiene: un giornalista non deve avere soggezione verso chi detiene il potere, perché solo così l'intervista diventa uno strumento di verità e non di propaganda. In un'epoca di comunicati stampa preconfezionati e conferenze senza contraddittorio, questa lezione resta più che mai attuale.`,

    quiz:[

      {q:"Qual è il principale pregio del metodo Fallaci secondo lo svolgimento?", opts:["Lo stile elegante","L'assenza di soggezione verso il potere","La velocità delle interviste","L'uso di molte fonti scritte"], correct:1},
      {q:"Quale limite viene riconosciuto nell'antitesi?", opts:["Che le sue interviste fossero troppo brevi","Che lo stile diretto rischi di compromettere l'obiettività","Che non intervistasse mai capi di Stato","Che scrivesse solo in inglese"], correct:1},

      {q:"Qual è la tesi principale dello svolgimento?", opts:["Ogni giornalista deve essere aggressivo","L'intervista seria è uno strumento di verità solo se libera da soggezione verso il potere","Le interviste sono meno importanti dei documenti scritti","Fallaci ha sbagliato ogni intervista"], correct:1}

  {

    guida:"Il testo-spunto, una lettera aperta indirizzata all'allora ministro dell'Istruzione, poneva una domanda di fondo sul senso e sulle finalità dell'esame di maturità.",
    domande:[
      "Quale interrogativo di fondo viene posto sul senso dell'esame di Stato?",
      "Che differenza esiste tra una valutazione basata sulle nozioni e una basata sul pensiero critico?",
      "In che modo la stessa prima prova di italiano (Tipologia B e C) risponde a questa esigenza?",
      "Perché le conoscenze di base restano comunque necessarie per argomentare bene?"

    metodo:"Nei temi su fatti di cronaca scolastica di cui non si ricordano tutti i dettagli, resta sul piano dei principi generali: è meglio un ragionamento solido su pochi elementi certi che un accumulo di dettagli incerti.",
    testo:`Una lettera aperta firmata da un gruppo di accademici, indirizzata all'allora ministro dell'Istruzione, ha riacceso il dibattito su cosa dovrebbe davvero valutare l'esame di Stato: la quantità di nozioni memorizzate o la capacità di ragionare, collegare, argomentare?

Condivido l'idea che un esame concentrato solo sulla verifica mnemonica rischi di premiare chi ha una buona memoria più di chi ha sviluppato un pensiero critico autonomo. La stessa prima prova di italiano, del resto, con le sue tipologie B e C, va in questa direzione: non chiede di ripetere contenuti, ma di argomentare una tesi personale a partire da uno stimolo.

Per questo penso che la vera sfida della scuola non sia scegliere tra conoscenze e capacità critiche, ma insegnarle insieme: fornire contenuti solidi e, allo stesso tempo, l'abitudine a metterli in relazione, metterli in discussione, usarli per costruire un pensiero autonomo. Un esame ben fatto dovrebbe premiare proprio questo equilibrio, non l'uno o l'altro isolatamente.`,

    testo:`Un messaggio WhatsApp letto e non ancora risposto genera, in molti, un disagio quasi fisico. Marco Belpoliti osserva che viviamo nell'era dell'istantaneità: tutto deve accadere subito, l'attesa è percepita come un tempo sprecato, quasi un fallimento della tecnologia che dovrebbe azzerare le distanze.

Sono convinto, però, che questa fretta continua abbia un costo che spesso non calcoliamo. L'attesa, infatti, non è solo un intervallo vuoto tra un desiderio e la sua soddisfazione: è il tempo in cui un pensiero matura, un dubbio si chiarisce, un desiderio si definisce meglio. Basti pensare alla scrittura di una lettera, pratica quasi scomparsa: il tempo necessario a scriverla e ad attendere la risposta permetteva di riflettere prima di dire qualcosa, mentre oggi un messaggio istantaneo viene spesso inviato d'impulso, senza la stessa cura.

È vero che l'immediatezza ha portato anche vantaggi reali, per esempio nelle emergenze o nel lavoro a distanza, dove poter comunicare subito con chi è lontano ha semplificato la vita di molte persone. Non si tratta dunque di rimpiangere il passato o di rifiutare la tecnologia, ma di recuperare, accanto alla velocità, anche la capacità di aspettare quando l'attesa ha un senso.

Per questo credo che il vero problema non sia la tecnologia in sé, ma l'incapacità, che essa può favorire, di tollerare anche solo pochi minuti di silenzio o di incertezza. Educarsi a saper aspettare — un risultato, una risposta, la soluzione di un problema — resta una competenza preziosa, forse ancora più necessaria oggi che tutto sembra dover accadere in tempo reale.`,

    metodo:"I temi storico-scientifici premiano chi sa distinguere il piano tecnico (che cosa rende possibile una scoperta) dal piano etico (chi decide come usarla): tienili sempre separati e poi rimettili in relazione nella conclusione.",
    testo:`La bomba atomica, nata dalla ricerca scientifica più avanzata del Novecento, rappresenta forse l'esempio più drammatico di come una scoperta possa essere insieme un progresso della conoscenza e una minaccia per la sopravvivenza dell'umanità. Giuseppe Galasso, ripercorrendo la logica dell'equilibrio del terrore durante la Guerra Fredda, mostra come due superpotenze abbiano evitato la guerra diretta proprio grazie alla reciproca capacità di distruggersi a vicenda.

Da questa vicenda storica nasce una riflessione che ritengo ancora attuale: la scienza, in sé, non è né buona né cattiva, è uno strumento; è l'uso che se ne fa, deciso dalla politica e dalla società, a determinarne le conseguenze morali. Lo stesso principio fisico che permette di produrre energia nucleare per scopi civili può essere impiegato per costruire armi di distruzione di massa.

Qualcuno potrebbe sostenere che gli scienziati dovrebbero rifiutarsi di condurre ricerche che possano avere applicazioni militari, come fecero alcuni fisici coinvolti nel Progetto Manhattan una volta viste le conseguenze del loro lavoro. È una posizione comprensibile, ma difficile da applicare in modo assoluto: la stessa ricerca sull'energia nucleare ha permesso, per esempio, importanti progressi in medicina, come la diagnostica per immagini e la cura di alcuni tumori.

Per questo credo che la vera responsabilità non ricada solo sugli scienziati, ma sull'intera società: servono leggi internazionali condivise, un controllo democratico sulle applicazioni militari della ricerca, un'opinione pubblica informata e capace di esercitare pressione sui governi. Solo attraverso questa responsabilità collettiva, e non attraverso il rifiuto della conoscenza, si può sperare di orientare il progresso scientifico verso il bene comune.`,

    testo:`Maria Agostina Cabiddu, giurista costituzionalista, pone una domanda che oggi appare quasi ovvia ma che meriterebbe più attenzione: l'accesso a internet è un diritto di cittadinanza al pari di altri diritti fondamentali, oppure resta un semplice servizio commerciale a cui si accede se ci si può permettere?

Credo che la prima risposta sia ormai quella corretta. Sempre più servizi essenziali - iscrizioni scolastiche, pratiche sanitarie, domande alla pubblica amministrazione, persino la ricerca di un lavoro - passano oggi attraverso piattaforme digitali. Chi non ha una connessione adeguata, o le competenze per usarla, rischia di restare escluso da diritti che dovrebbero essere garantiti a tutti.

Si potrebbe obiettare che paragonare l'accesso a internet a diritti storici come l'istruzione o la salute sia eccessivo, trattandosi in fondo di un'infrastruttura tecnologica e non di un bisogno primario. È un'obiezione che aveva senso vent'anni fa, quando internet era un servizio accessorio; oggi, con la progressiva digitalizzazione dei servizi pubblici, la situazione è cambiata radicalmente.

    testo:`Viviamo immersi in un rumore quasi continuo: notifiche, musica di sottofondo, voci, traffico. Nicoletta Polla-Mattiot invita a riscoprire il silenzio non come assenza di suono, ma come condizione necessaria per l'ascolto autentico - di sé, degli altri, della natura.

Trovo questa distinzione fondamentale: il silenzio di cui parla l'autrice non è un vuoto da riempire al più presto, ma uno spazio attivo in cui il pensiero può finalmente organizzarsi, senza le continue interruzioni a cui siamo abituati. Non a caso molti musicisti e scrittori raccontano di aver bisogno di momenti di silenzio assoluto per comporre o scrivere: il silenzio, paradossalmente, è ciò che rende possibile la creazione.

Qualcuno potrebbe obiettare che nella vita reale, soprattutto per i più giovani, il rumore di fondo - musica, social, conversazioni - non sia un disturbo ma una forma di compagnia, un modo per non sentirsi soli. È un'osservazione comprensibile: il silenzio può generare anche disagio, se non lo si è mai praticato.

Per questo credo che il silenzio vada reintrodotto gradualmente nella vita quotidiana, non come imposizione ma come abitudine da costruire: pochi minuti al giorno senza dispositivi, per riabituarsi ad ascoltare i propri pensieri prima ancora che quelli degli altri.`,

    testo:`Rita Levi Montalcini, premio Nobel per la Medicina, ha intitolato la propria autobiografia Elogio dell'imperfezione: un titolo che può sorprendere, se pensiamo al percorso di eccellenza scientifica della sua vita. Eppure proprio lei, che ha conosciuto le discriminazioni razziali e le difficoltà di essere donna nella scienza del Novecento, sceglie di mettere al centro non la perfezione, ma il limite accettato e trasformato in energia.

Trovo che questa prospettiva sia particolarmente utile per chi, come noi studenti, vive spesso sotto la pressione di modelli di perfezione irraggiungibili, amplificati oggi dai social network, dove le vite altrui appaiono sempre riuscite e prive di difetti. Questa pressione può generare ansia, insicurezza, senso di inadeguatezza.

L'imperfezione di cui parla Levi Montalcini non è però un alibi per non impegnarsi, bensì la consapevolezza che ogni limite personale può diventare, se accettato, un punto di partenza: la scienziata stessa racconta come alcune sue difficoltà, superate con tenacia, siano diventate motore delle sue scoperte. Diverso è il caso di chi usa l'imperfezione come scusa per rinunciare a migliorarsi: qui la riflessione rischia di scivolare in una giustificazione comoda.

    guida:"Il testo rifletteva sulla trasformazione del diario personale, da luogo privato e intimo a spazio pubblico di condivisione (blog, social, profili), e su come questo cambiamento influisca sulla scrittura di sé.",
    domande:[

    metodo:"Nei temi sulla trasformazione digitale di un'abitudine antica (qui: il diario), parti sempre dal confronto tra la forma tradizionale e quella nuova, prima di valutarne vantaggi e rischi.",
    testo:`Il diario intimo, per generazioni, è stato il luogo privato per eccellenza: un quaderno chiuso a chiave, pensieri scritti per sé stessi, senza lettori. Maurizio Caminito osserva come oggi questa forma si sia trasformata: blog, profili social, storie quotidiane sono diventati i nuovi «diari», ma scritti sapendo fin dall'inizio che qualcuno li leggerà.

Credo che questo cambiamento non sia solo tecnico, ma tocchi il senso stesso della scrittura di sé. Il diario tradizionale permetteva l'onestà perché non doveva piacere a nessuno; il diario pubblico di oggi, invece, è spesso condizionato dal desiderio di essere approvati, di ricevere un like, di mostrare una versione di sé più curata di quella reale.

È vero che i nuovi strumenti digitali hanno anche aspetti positivi: permettono di condividere esperienze, trovare persone con vissuti simili, costruire comunità attorno a un'esperienza personale, cosa impossibile con un diario chiuso in un cassetto. Non si tratta dunque di rimpiangere il diario cartaceo come unico modello autentico.

Per questo penso che il vero rischio non sia scrivere di sé in pubblico, ma perdere la capacità di scrivere anche solo per sé stessi, senza l'aspettativa di un giudizio altrui: un equilibrio che vale la pena custodire, oggi più che mai.`,

    testo:`Piers Brendon ricostruisce gli anni Trenta come il decennio in cui il mito del mercato capace di autoregolarsi crollò insieme alla Borsa di New York nel 1929. La risposta di Franklin Delano Roosevelt, il New Deal, segnò una svolta storica: per la prima volta lo Stato americano intervenne direttamente nell'economia con opere pubbliche, sussidi, regole bancarie, per rilanciare occupazione e consumi.

Ritengo che questa vicenda offra una lezione ancora attuale: nelle grandi crisi economiche, lasciare che il mercato si aggiusti da solo può significare anni di disoccupazione e povertà diffusa, mentre un intervento pubblico mirato può accorciare i tempi della ripresa e attutirne i costi sociali.

Qualcuno potrebbe obiettare che un intervento statale troppo esteso rischi di generare inefficienze, debito pubblico crescente e dipendenza dai sussidi, disincentivando l'iniziativa privata. È un'obiezione seria, che trova conferma in alcune politiche economiche successive, non sempre efficaci quanto il New Deal.

    testo:`Che l'Istituto Treccani abbia scelto «rispetto» come parola del 2024 non è un caso: in un'epoca di toni aspri nel dibattito pubblico, online e non solo, il bisogno di questa parola sembra crescere proprio mentre la sua pratica diminuisce. Riccardo Maccioni riflette su cosa significhi davvero rispettare qualcuno, oltre l'uso ormai logoro del termine.

Credo che il rispetto autentico non coincida con la semplice tolleranza, intesa come il limitarsi a non attaccare chi la pensa diversamente. Rispettare qualcuno significa riconoscergli una dignità di interlocutore, ascoltare le sue ragioni prima di giudicarle, anche quando si è convinti che abbia torto.

Si potrebbe obiettare che, di fronte a posizioni che negano diritti fondamentali di altre persone, il rispetto rischi di trasformarsi in un'accettazione passiva di idee inaccettabili. È un punto delicato: rispettare una persona non significa necessariamente rispettare ogni sua opinione, soprattutto quando questa nega la dignità di qualcun altro.

    metodo:"Quando il testo-guida propone un'immagine forte (qui: fama di pochi secondi vs tracce di migliaia di anni), riprendila esplicitamente all'inizio: è il modo più rapido per dimostrare di aver capito il testo prima di argomentare.",
    testo:`Andy Warhol prevedeva per ognuno «un quarto d'ora di celebrità»; oggi i social hanno ridotto drasticamente questo tempo, a volte a pochi secondi di un video virale. Telmo Pievani rovescia però la prospettiva e la lega a una scala temporale ben più ampia, quella geologica: mentre la nostra fama personale svanisce in fretta, l'impronta della nostra civiltà sul pianeta — plastica, CO2, cemento — resterà leggibile nelle rocce per migliaia di anni. È il paradosso dell'Antropocene, l'epoca in cui l'uomo è diventato una forza geologica.

Trovo questa immagine molto efficace per riflettere su un cortocircuito tipico della nostra epoca: viviamo concentrati sull'immediato, sulla visibilità istantanea, mentre le nostre azioni collettive — il modo in cui produciamo, consumiamo, ci spostiamo — hanno conseguenze che dureranno ben oltre la nostra vita e quella dei nostri nipoti.

Si potrebbe obiettare che il singolo individuo può fare poco di fronte a fenomeni globali come il cambiamento climatico, e che la responsabilità principale ricada su Stati e grandi aziende. È vero solo in parte: le scelte quotidiane di milioni di persone — come muoversi, cosa acquistare, come informarsi — orientano nel tempo anche le politiche pubbliche e le strategie delle imprese, come dimostrano i cambiamenti nei consumi alimentari o nella mobilità degli ultimi anni.

Per questo credo che la vera sfida della nostra generazione sia imparare a pensare su due scale di tempo insieme: quella breve, dei social e dell'attualità, e quella lunga, geologica, delle conseguenze ambientali. Solo tenendo insieme questi due sguardi possiamo trasformare l'attenzione effimera in cui viviamo in una responsabilità duratura verso chi verrà dopo di noi.`,

    testo:`Paolo Borsellino, magistrato ucciso dalla mafia nel 1992, indicava nei giovani la vera speranza per sconfiggere la criminalità organizzata: non le manette, da sole, ma un cambiamento culturale profondo, capace di rendere la mafia socialmente inaccettabile fin dall'infanzia.

Per questo la scuola ha un ruolo cruciale, forse ancora più importante di quanto si pensi: educare alla legalità non significa solo spiegare cosa dice il codice penale, ma costruire esperienze concrete di cittadinanza attiva, far conoscere le storie di chi ha pagato con la vita l'impegno contro la mafia, come lo stesso Borsellino, e mostrare esempi positivi di riscatto sociale nei territori più difficili.

    testo:`Un video, un post, una notizia: bastano pochi secondi perché l'indignazione collettiva si accenda sui social, si diffonda, e altrettanto rapidamente si spenga per lasciare spazio alla prossima causa. Anna Meldolesi e Chiara Lalli si chiedono se questa indignazione permanente serva davvero a qualcosa, o se sia solo un rumore emotivo senza conseguenze reali.

Penso che l'indignazione online abbia un valore quando riesce a trasformarsi in qualcosa di concreto: una raccolta firme, una pressione politica reale, un cambiamento di comportamento diffuso. Storicamente, alcune importanti battaglie per i diritti civili sono partite da un'ondata di indignazione pubblica canalizzata verso obiettivi precisi.

È vero, però, che sui social l'indignazione rischia spesso di restare fine a sé stessa: un like o una condivisione danno la sensazione di aver «fatto qualcosa», quando in realtà non è cambiato nulla nella realtà dei fatti. Questo fenomeno, talvolta chiamato «slacktivism», rischia di sostituire l'impegno reale con un gesto simbolico e poco costoso.

Per questo credo che la vera domanda non sia se indignarsi sia giusto o sbagliato, ma cosa si fa dopo essersi indignati: se l'indignazione resta un post, serve a poco; se diventa il primo passo di un'azione concreta, può davvero contribuire al cambiamento.`,
    commento:[
      "Introdurre subito il meccanismo (indignazione che si accende e si spegne in fretta) mostra comprensione del fenomeno prima di giudicarlo.",
      "Il riferimento storico ai movimenti per i diritti civili dà spessore all'argomentazione senza scadere nel generico.",
      "Il termine tecnico «slacktivism» è usato e spiegato in una riga: buona pratica quando si introduce un concetto specialistico."
    ],
    quiz:[

      {q:"Quando, secondo lo svolgimento, l'indignazione ha un valore reale?", opts:["Sempre, in ogni caso","Quando si trasforma in azione concreta (raccolta firme, pressione politica, ecc.)","Mai, è sempre inutile","Solo se diventa virale"], correct:1},
      {q:"Che cosa indica il termine «slacktivism»?", opts:["Un tipo di attivismo violento","Un attivismo simbolico e poco costoso che sostituisce l'impegno reale","Una forma di censura","Un tipo di algoritmo social"], correct:1},
      {q:"Quale esempio storico viene usato per sostenere il valore dell'indignazione?", opts:["La rivoluzione industriale","Alcune battaglie per i diritti civili nate da ondate di indignazione pubblica","La caduta dell'impero romano","L'invenzione di internet"], correct:1},

    testo:`Un tempo diventare adulti coincideva con eventi precisi: finire la scuola, trovare un lavoro stabile, sposarsi, avere figli. Oggi questi confini si sono fatti sfumati: si resta più a lungo nella casa dei genitori, si cambiano più lavori, si rimanda ogni scelta definitiva. Frank Furedi sostiene che, nonostante questo, i confini tra le età della vita restano importanti, perché aiutano a orientarsi e a maturare un senso di responsabilità.

Sono d'accordo con questa idea, pur con una precisazione. Non credo che il problema sia l'assenza di confini rigidi come in passato: la società cambia, ed è naturale che cambino anche i tempi della crescita personale. Il rischio vero, semmai, è che l'assenza di tappe riconoscibili si trasformi in un'assenza di responsabilità, in una condizione di "adultescenza" prolungata in cui non ci si assume mai fino in fondo doveri verso sé stessi e verso gli altri.

Qualcuno potrebbe obiettare che rimandare le scelte importanti sia oggi una necessità, non una scelta: precarietà lavorativa, affitti alti, incertezza economica rendono difficile, per molti giovani, l'indipendenza che un tempo segnava l'ingresso nell'età adulta. È un'obiezione fondata, che sposta parte della responsabilità dal singolo alle condizioni sociali ed economiche del suo tempo.

Per questo credo che il vero confine da difendere non sia un'età anagrafica precisa, ma un atteggiamento interiore: la capacità di assumersi gradualmente responsabilità crescenti, verso lo studio, il lavoro, le relazioni, indipendentemente dai tempi imposti dall'economia. Diventare adulti, in questo senso, resta un processo, ma un processo che va comunque intrapreso, senza rimandarlo indefinitamente.`,

    metodo:"Attento agli stereotipi generazionali: un buon tema di attualità non accusa né difende in blocco «i giovani», ma distingue i fenomeni culturali dai singoli individui.",
    testo:`Mario Calabresi, nel suo libro Alzarsi all'alba, racconta la fatica come un'esperienza che sembra progressivamente scomparire dall'immaginario delle nuove generazioni, pur restando molto presente nella vita quotidiana di chi svolge lavori manuali o si trova in condizioni economiche difficili. È un'osservazione che mi sembra colga un cambiamento reale nel modo in cui pensiamo all'impegno e al sacrificio.

Molti miei coetanei associano oggi il successo più alla rapidità e alla facilità — diventare famosi con un video, arricchirsi con un investimento fortunato — che alla fatica prolungata nel tempo. Questo non significa che i giovani siano più pigri delle generazioni precedenti, come talvolta si sente dire in modo semplicistico, ma che i modelli culturali dominanti, amplificati dai social, celebrano soprattutto risultati immediati.

Allo stesso tempo, sarebbe sbagliato idealizzare la fatica del passato come se fosse sempre stata un valore positivo: molte fatiche di ieri erano imposte da condizioni di sfruttamento, non scelte liberamente, e non è un progresso da rimpiangere il fatto che oggi si lavori, in molti settori, con maggiore sicurezza e minore usura fisica.

Credo però che esista una fatica diversa, quella dello studio prolungato, dell'allenamento costante, della pratica ripetuta necessaria per imparare davvero qualcosa: questa fatica resta insostituibile, perché nessuna scorciatoia tecnologica può sostituire il tempo necessario a costruire una competenza solida. Per questo penso che il compito della scuola sia proprio insegnare a distinguere le fatiche inutili da quelle formative, e a non avere paura di queste ultime, anche quando i risultati non sono immediati.`,

      {q:"Quale compito viene assegnato alla scuola nella conclusione?", opts:["Eliminare ogni forma di fatica dallo studio","Insegnare a distinguere le fatiche inutili da quelle formative, senza temere queste ultime","Vietare l'uso dei social a scuola","Premiare solo i risultati immediati"], correct:1}
    ]
  }
]
};

function buildNav(){
  const tabs = [{id:"guida", label:"📖 Guida"}, ...anni.map(a=>({id:a,label:a})), {id:"checklist", label:"✅ Checklist"}];
  const nav = document.getElementById("nav");
  tabs.forEach((t,i)=>{
    const b = document.createElement("button");
    b.textContent = t.label;
    b.dataset.tab = t.id;
    if(i===0) b.classList.add("active");
    b.onclick = ()=> showTab(t.id);
    nav.appendChild(b);
  });
}

function buildQuiz(anno, idx, quiz){
  let html = `<div class="quiz-box" id="quiz-${anno}-${idx}"><h4>Quiz di verifica — 5 domande</h4>`;
  quiz.forEach((q, qi)=>{
    html += `<div class="quiz-q" data-correct="${q.correct}">
      <p class="qtext">${qi+1}. ${q.q}</p>`;
    q.opts.forEach((opt, oi)=>{
      html += `<label><input type="radio" name="q-${anno}-${idx}-${qi}" value="${oi}"> ${opt}</label>`;
    });
    html += `</div>`;
  });
  html += `<button class="quiz-btn" onclick="checkQuiz('${anno}','${idx}')">Correggi il quiz</button>
    <div class="quiz-result" id="result-${anno}-${idx}"></div></div>`;
  return html;
}

function checkQuiz(anno, idx){
  const box = document.getElementById(`quiz-${anno}-${idx}`);
  const questions = box.querySelectorAll(".quiz-q");
  let score = 0;
  questions.forEach((qEl, qi)=>{
    const correct = parseInt(qEl.dataset.correct);
    const labels = qEl.querySelectorAll("label");
    const selected = qEl.querySelector(`input[name="q-${anno}-${idx}-${qi}"]:checked`);
    labels.forEach(l=> l.classList.remove("correct","wrong"));
    labels[correct].classList.add("correct");
    if(selected){
      const selVal = parseInt(selected.value);
      if(selVal === correct){ score++; }
      else { labels[selVal].classList.add("wrong"); }
    }
  });
  const result = document.getElementById(`result-${anno}-${idx}`);
  let msg = `Punteggio: ${score}/5 — `;
  if(score === 5) msg += "ottimo, hai compreso a fondo sia la tipologia sia lo svolgimento!";
  else if(score >= 3) msg += "buon lavoro, rivedi le risposte evidenziate in rosso.";
  else msg += "rileggi lo svolgimento e il commento, poi riprova.";
  result.textContent = msg;
}

function buildYearTab(anno){
  const temi = dati[anno];
  let html = `<div class="year-block"><div class="year-title">Prima Prova ${anno}</div>
    <div class="year-sub">Tre tracce di Tipologia B (testo argomentativo) e due di Tipologia C (attualità) — tutte le tracce ufficiali di quell'anno.</div>`;
  temi.forEach((t, idx)=>{
    const bodyId = `body-${anno}-${idx}`;
    html += `
    <div class="tema-card">
      <div class="tema-head" onclick="toggleTema('${bodyId}', this)">
        <div class="tema-head-text">
          <span class="tipo-badge badge-${t.tipo}">${t.numero}</span><strong>${t.titolo}</strong>
          <span class="fonte">${t.fonte}</span>
        </div>
        <span class="chevron">▾</span>
      </div>
      <div class="tema-body" id="${bodyId}">
        <h4>Che cosa chiedeva la traccia</h4>
        <p>${t.guida}</p>
        <h4>Domande di comprensione — tipiche di questa traccia</h4>
        <div class="domande"><ol>${t.domande.map(d=>`<li>${d}</li>`).join("")}</ol></div>
        <h4>Come affrontarla — consiglio del metodo</h4>
        <p>${t.metodo}</p>
        <h4>Svolgimento modello (elaborato originale, a scopo didattico)</h4>
        <div class="svolgimento">${t.testo.split("\n\n").map(p=>`<p>${p}</p>`).join("")}</div>
        <h4>Commento — perché funziona</h4>
        <div class="commento"><ul>${t.commento.map(c=>`<li>${c}</li>`).join("")}</ul></div>

  html += `</div>`;
  return html;
}

function toggleTema(id, headEl){
  const body = document.getElementById(id);
  const chevron = headEl.querySelector(".chevron");
  const opening = !body.classList.contains("open");
  body.classList.toggle("open");
  chevron.style.transform = opening ? "rotate(180deg)" : "rotate(0deg)";
}

function buildGuida(){
  return `
  <div class="note-box">
    <strong>Una nota importante sulle fonti.</strong> Le tracce ufficiali del Ministero contengono spesso ampi estratti di opere e articoli coperti da diritto d'autore (libri di Piero Angela, Rita Levi Montalcini, Telmo Pievani, articoli di giornale, ecc.). Per questo motivo qui non viene riportato il testo integrale dei brani-guida, ma una sintesi fedele del loro contenuto, con indicazione precisa di autore, titolo e fonte. Per leggere il testo integrale ufficiale, l'unica fonte corretta e legale è il sito del <strong>Ministero dell'Istruzione e del Merito</strong> (<a href="https://www.istruzione.it" target="_blank" rel="noopener">www.istruzione.it</a>), sezione «Esame di Stato» → «Tracce ed esempi», dove sono pubblicati i PDF ufficiali di ogni sessione dal 2005 a oggi. Gli <em>svolgimenti</em> presentati in questa app sono invece elaborati originali, scritti apposta come modelli didattici — non sono le prove ufficiali dei candidati.

    <p>Dal 2024 una delle tre tracce di Tipologia B è dedicata obbligatoriamente all'ambito storico: è quindi una buona idea ripassare, negli ultimi mesi, i grandi nodi del Novecento (guerre mondiali, Guerra Fredda, Costituzione, decolonizzazione), perché ricorrono con costanza.</p>
  </div>

  <div class="card">
    <h2>2. Cosa distingue Tipologia B e Tipologia C</h2>
    <table class="grid">
      <tr><th></th><th>Tipologia B — Testo argomentativo</th><th>Tipologia C — Riflessione di attualità</th></tr>
      <tr><td><strong>Cosa ti dà il Ministero</strong></td><td>Un testo-guida (storico, filosofico, scientifico, letterario) da analizzare, spesso con domande di comprensione</td><td>Un testo-spunto più breve, legato a un tema di attualità, con meno vincoli di analisi</td></tr>
      <tr><td><strong>Cosa devi fare prima</strong></td><td>Riassumere la tesi dell'autore e individuare la struttura argomentativa del testo</td><td>Capire il nodo centrale del tema proposto, anche senza un'analisi testuale dettagliata</td></tr>

      <tr><td><strong>Rischio principale</strong></td><td>Parafrasare il testo invece di argomentare in proprio</td><td>Scrivere un tema generico, senza una tesi precisa e senza esempi concreti</td></tr>

  </div>

  <div class="card">

  <div class="card">

    <div class="step"><div class="step-num">2</div><div class="step-body"><h4>Comprendi il testo-guida (B) o il nodo del tema (C)</h4><p>Sottolinea la tesi dell'autore e le parole-chiave. Scrivi a margine, in una riga, "l'autore sostiene che...". Se non sai riassumerla in una frase, non l'hai ancora capita.</p></div></div>

    <p>Ogni paragrafo del corpo centrale può seguire questo schema minimo, molto utile per chi parte da un livello base:</p>
    <table class="grid">
      <tr><th>Passaggio</th><th>Funzione</th></tr>

function buildChecklist(){
  const voci = [
    "Ho letto tutte le tracce prima di scegliere quella definitiva",
    "So riassumere in una frase la tesi del testo-guida (Tipologia B) o il nodo del tema (Tipologia C)",
    "Ho risposto mentalmente alle domande di comprensione tipiche di quella traccia",
    "La mia tesi personale è scritta in modo chiaro fin dall'introduzione",
    "Ogni paragrafo del corpo centrale ha almeno un esempio concreto, non solo affermazioni generiche",
    "Ho inserito un'antitesi vera (non di comodo) e l'ho confutata con un argomento, non con un'opinione",
    "Ho usato connettivi logici per collegare i paragrafi (per questo, tuttavia, d'altra parte...)",
    "La conclusione rilancia il discorso, non ripete semplicemente l'introduzione",
    "Il testo ha una lunghezza adeguata (indicativamente 3-4 colonne)",
    "Ho riletto controllando ortografia, punteggiatura e concordanze"
  ];
  return `
  <div class="card">
    <h2>Checklist finale prima della consegna</h2>
    <p>Da spuntare mentalmente (o su carta) negli ultimi minuti della prova.</p>
    <ul class="checklist">
      ${voci.map(v=>`<li><input type="checkbox"><span>${v}</span></li>`).join("")}
    </ul>
  </div>
  <div class="card">
    <h2>Errori più comuni da evitare</h2>
    <ul>
      <li><strong>Parafrasare invece di argomentare</strong> (Tipologia B): riassumere il testo-guida non basta, serve una tua tesi personale.</li>
      <li><strong>Tema generico</strong> (Tipologia C): evita frasi come "è un argomento molto discusso oggi" senza mai prendere posizione.</li>
      <li><strong>Antitesi finta</strong>: non introdurre un'obiezione debole solo per confutarla facilmente; sceglierne una credibile rende il testo più maturo.</li>
      <li><strong>Conclusione-fotocopia</strong>: ripetere l'introduzione con altre parole è un'occasione persa; meglio rilanciare con una proposta o un'implicazione.</li>
      <li><strong>Divagazione</strong>: ogni paragrafo deve essere riconducibile alla tesi iniziale; se non lo è, va tagliato o riformulato.</li>
    </ul>
  </div>
  `;
}

function showTab(id){
  document.querySelectorAll("nav button").forEach(b=> b.classList.toggle("active", b.dataset.tab===id));
  const main = document.getElementById("main");
  main.innerHTML = "";
  if(id === "guida"){
    main.innerHTML = buildGuida();
  } else if(id === "checklist"){
    main.innerHTML = buildChecklist();
  } else {
    main.innerHTML = buildYearTab(id);
  }
}

buildNav();
showTab("guida");
